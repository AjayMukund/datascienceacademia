<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson — Data Science Academia</title>
<link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#0b0c0e">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../portal.css">
<style>
/* ── Full-screen lesson layout (overrides portal-body grid) ── */
html, body { height: 100%; overflow: hidden; }
.lesson-page {
  display: flex;
  flex-direction: column;
  height: 100vh;
  background: var(--ink);
  overflow: hidden;
}

/* ── Topbar ── */
.lesson-topbar {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: 0 1.1rem;
  height: 52px;
  flex-shrink: 0;
  background: var(--glass2);
  border-bottom: 1px solid var(--border);
  z-index: 50;
}
.lesson-back {
  font-family: var(--fb); font-size: .72rem; color: var(--fog2);
  text-decoration: none; white-space: nowrap; flex-shrink: 0;
  display: inline-flex; align-items: center; gap: .3rem;
  transition: color .2s;
}
.lesson-back:hover { color: var(--champ2); }
.lesson-topbar-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
.lesson-topbar-center {
  flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;
}
.lesson-topbar-title {
  font-family: var(--fb); font-size: .82rem; font-weight: 600; color: var(--cream);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lesson-topbar-meta { font-family: var(--fb); font-size: .68rem; color: var(--fog2); }
.lesson-topbar-actions { display: flex; gap: .4rem; align-items: center; flex-shrink: 0; }
.lesson-topbar-actions .portal-btn,
.lesson-topbar-actions .portal-btn-ghost { font-size: .72rem; padding: 5px 12px; }
.lesson-topbar-user {
  display: flex; align-items: center; gap: .5rem; flex-shrink: 0;
  padding-left: .5rem; border-left: 1px solid var(--border);
}
.lesson-topbar-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--champ); color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--fb); font-size: .75rem; font-weight: 700;
}
.lesson-signout {
  font-family: var(--fb); font-size: .7rem; color: var(--fog2);
  background: none; border: none; cursor: pointer; padding: 0;
  transition: color .2s;
}
.lesson-signout:hover { color: #f66; }

/* ── Main area ── */
.lesson-main {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* ── Course nav panel (left) ── */
.lesson-nav {
  width: 288px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  background: rgba(11,12,14,.6);
  transition: width .25s ease, opacity .2s ease;
  overflow: hidden;
}
.lesson-nav.collapsed { width: 0; opacity: 0; pointer-events: none; }

.lesson-nav-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: .7rem 1rem;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.lesson-nav-header span {
  font-family: var(--fb); font-size: .72rem; font-weight: 600;
  color: var(--fog2); text-transform: uppercase; letter-spacing: .05em;
}
.lesson-nav-toggle {
  background: none; border: 1px solid var(--border); border-radius: 5px;
  color: var(--fog2); font-size: .65rem; padding: 3px 7px; cursor: pointer;
  transition: all .2s; line-height: 1;
}
.lesson-nav-toggle:hover { border-color: var(--fog2); color: var(--cream); }

.lesson-nav-list { flex: 1; overflow-y: auto; }
.lesson-nav-list::-webkit-scrollbar { width: 4px; }
.lesson-nav-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Accordion modules */
.lsb-module { border-bottom: 1px solid var(--border); }
.lsb-module-hd {
  display: flex; align-items: center; gap: .6rem;
  padding: .72rem 1rem; cursor: pointer;
  font-family: var(--fb); font-size: .75rem; font-weight: 600; color: var(--fog2);
  background: rgba(255,255,255,.015);
  user-select: none; transition: background .15s, color .15s;
}
.lsb-module-hd:hover { background: rgba(255,255,255,.04); color: var(--cream); }
.lsb-module.open .lsb-module-hd { color: var(--cream); }
.lsb-chevron {
  margin-left: auto; font-size: .65rem; color: var(--fog2);
  transition: transform .2s; display: inline-block;
}
.lsb-module.open .lsb-chevron { transform: rotate(90deg); }
.lsb-module-body { display: none; }
.lsb-module.open .lsb-module-body { display: block; }

.lsb-lesson {
  display: flex; align-items: center; gap: .65rem;
  padding: .52rem 1rem .52rem 1.4rem;
  text-decoration: none;
  font-family: var(--fb); font-size: .77rem; color: var(--fog2);
  border-left: 2px solid transparent;
  transition: background .15s, color .15s, border-color .15s;
}
.lsb-lesson:hover { background: rgba(255,255,255,.03); color: var(--cream); }
.lsb-lesson.active {
  background: rgba(62,207,178,.07);
  border-left-color: var(--teal);
  color: var(--cream);
}
.lsb-lesson.done { color: var(--fog2); }
.lsb-lesson-title { flex: 1; line-height: 1.35; }
.lt-icon { font-size: .7rem; flex-shrink: 0; width: 20px; text-align: center; }

/* ── Show-panel tab (appears when nav is collapsed) ── */
.lesson-nav-show {
  position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  z-index: 40;
  background: var(--glass2); border: 1px solid var(--border);
  border-left: none; border-radius: 0 6px 6px 0;
  padding: .75rem .35rem; cursor: pointer;
  color: var(--fog2); font-size: .65rem;
  display: none; flex-direction: column; align-items: center; gap: .3rem;
  transition: color .2s;
  writing-mode: initial;
}
.lesson-nav-show:hover { color: var(--cream); }
.lesson-main.nav-open .lesson-nav-show { display: none; }
.lesson-main.nav-closed .lesson-nav-show { display: flex; }

/* ── Content area ── */
.lesson-content-area {
  flex: 1; overflow-y: auto; display: flex; flex-direction: column;
}
.lesson-content-area::-webkit-scrollbar { width: 5px; }
.lesson-content-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.lesson-player-embed {
  flex: 1;
  min-height: 480px;
  background: #000;
  position: relative;
}
.lesson-player-embed.text-mode {
  background: transparent;
  min-height: auto;
  flex: none;
}

/* ── Comments ── */
.lesson-comments {
  max-width: 820px; margin: 2rem auto; padding: 0 1.5rem 3rem; width: 100%;
}
.lesson-comments-title {
  font-family: var(--fd); font-size: 1rem; font-weight: 600;
  color: var(--cream); margin-bottom: 1.25rem;
  padding-bottom: .75rem; border-bottom: 1px solid var(--border);
}

/* ── Responsive ── */
@media (max-width: 680px) {
  .lesson-nav { width: 100%; position: absolute; z-index: 30; height: 100%; }
  .lesson-nav.collapsed { width: 0; }
  .lesson-topbar-title { font-size: .75rem; }
  .lesson-topbar-meta { display: none; }
}
</style>
</head>
<body>
<div class="cur" id="cur"></div><canvas id="fluid-canvas"></canvas>

<div class="lesson-page">

  <!-- Topbar -->
  <header class="lesson-topbar">
    <a id="back-link" href="courses.html" class="lesson-back">← Back to Course</a>
    <div class="lesson-topbar-divider"></div>
    <div class="lesson-topbar-center">
      <div class="lesson-topbar-title" id="lesson-title">Loading…</div>
      <div class="lesson-topbar-meta" id="lesson-meta"></div>
    </div>
    <div class="lesson-topbar-actions">
      <button class="portal-btn-ghost" id="prev-btn" disabled>← Prev</button>
      <button class="portal-btn" id="done-btn" onclick="markDone()">✓ Mark Complete</button>
      <button class="portal-btn-ghost" id="next-btn" disabled>Next →</button>
    </div>
    <div class="lesson-topbar-user">
      <div class="lesson-topbar-avatar portal-avatar">A</div>
      <button class="lesson-signout portal-logout">Sign out</button>
    </div>
  </header>

  <!-- Main: nav panel + content -->
  <div class="lesson-main nav-open" id="lesson-main">

    <!-- Course content accordion panel -->
    <div class="lesson-nav" id="lesson-nav">
      <div class="lesson-nav-header">
        <span>Course Content</span>
        <button class="lesson-nav-toggle" onclick="toggleNav()" title="Hide panel">◀ Hide</button>
      </div>
      <div class="lesson-nav-list" id="lesson-list">
        <div style="padding:1.5rem 1rem;color:var(--fog2);font-family:var(--fb);font-size:.82rem;">Loading…</div>
      </div>
    </div>

    <!-- Show-panel tab (visible when collapsed) -->
    <button class="lesson-nav-show" id="nav-show-btn" onclick="toggleNav()" title="Show course content">
      ▶ <span style="writing-mode:vertical-rl;font-family:var(--fb);font-size:.65rem;letter-spacing:.06em;">Contents</span>
    </button>

    <!-- Lesson content -->
    <div class="lesson-content-area" id="lesson-content-area">
      <div class="lesson-player-embed" id="player-embed">
        <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--fog2);font-family:var(--fb);">Loading…</div>
      </div>

      <!-- Discussion -->
      <div class="lesson-comments" id="comments-section">
        <div class="lesson-comments-title">Discussion</div>
        <form id="comment-form" style="display:flex;gap:.75rem;margin-bottom:1.5rem;align-items:flex-start;">
          <div class="lesson-topbar-avatar portal-avatar" id="comment-avatar" style="width:36px;height:36px;font-size:.9rem;flex-shrink:0;">?</div>
          <div style="flex:1;display:flex;flex-direction:column;gap:.5rem;">
            <textarea class="fi" id="comment-input" placeholder="Ask a question or share your thoughts…" rows="2" style="resize:vertical;min-height:60px;font-family:var(--fb);font-size:.88rem;"></textarea>
            <button type="submit" class="portal-btn" style="align-self:flex-end;font-size:.8rem;padding:7px 18px;">Post Comment</button>
          </div>
        </form>
        <div id="comment-list"></div>
      </div>
    </div>

  </div><!-- lesson-main -->
</div><!-- lesson-page -->

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/portal.js"></script>
<script src="../script.js"></script>
<script src="../lesson-content.js"></script>
<script src="../sql-content.js"></script>

<script src="../ml-content.js"></script>
<script src="../dl-content.js"></script>
<script>
const params   = new URLSearchParams(location.search);
const lessonId = params.get('id');
const courseId = params.get('course');
const LT = {video:{icon:'🎬',cls:'lt-video'},pdf:{icon:'📄',cls:'lt-pdf'},quiz:{icon:'📝',cls:'lt-quiz'},live:{icon:'🔴',cls:'lt-live'},text:{icon:'📖',cls:'lt-text'}};
let allLessons=[], currentIdx=0;

function toast(m,t='success'){const el=document.createElement('div');el.className=`toast-item ${t}`;el.textContent=m;document.getElementById('toast').appendChild(el);setTimeout(()=>el.remove(),3500);}

/* ── Nav panel toggle ──────────────────────────────────────────────────── */
function toggleNav(){
  const nav  = document.getElementById('lesson-nav');
  const main = document.getElementById('lesson-main');
  const open = nav.classList.toggle('collapsed');
  main.classList.toggle('nav-open',  !open);
  main.classList.toggle('nav-closed', open);
}

/* ── Embeds ────────────────────────────────────────────────────────────── */
function ytEmbed(url){
  const m=url.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
  return m?`https://www.youtube.com/embed/${m[1]}?rel=0&modestbranding=1`:null;
}
function vimeoEmbed(url){
  const m=url.match(/vimeo\.com\/(\d+)/);
  return m?`https://player.vimeo.com/video/${m[1]}`:null;
}
function buildEmbed(lesson){
  const embed = document.getElementById('player-embed');
  if(lesson.type==='text'){
    embed.classList.add('text-mode');
    embed.style.background='transparent';
    return buildTextLesson(lesson.content_url, lesson);
  }
  embed.classList.remove('text-mode');
  embed.style.background='#000';
  const url=lesson.content_url||'';
  if(!url)return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:1rem;color:var(--fog2);font-family:var(--fb);"><div style="font-size:2.5rem;">${LT[lesson.type]?.icon||'📄'}</div><div>No content URL provided.</div></div>`;
  const yt=ytEmbed(url);
  if(yt)return `<iframe src="${yt}" allowfullscreen allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" style="width:100%;height:100%;border:none;"></iframe>`;
  const vm=vimeoEmbed(url);
  if(vm)return `<iframe src="${vm}" allowfullscreen style="width:100%;height:100%;border:none;"></iframe>`;
  if(lesson.type==='pdf')return `<iframe src="${url}" style="width:100%;height:100%;border:none;"></iframe>`;
  if(lesson.type==='video')return `<video controls style="width:100%;height:100%;background:#000;"><source src="${url}">Your browser does not support video.</video>`;
  return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:1rem;color:var(--fog2);font-family:var(--fb);"><div style="font-size:2.5rem;">${LT[lesson.type]?.icon||'🔗'}</div><a href="${url}" target="_blank" class="portal-btn">Open Content →</a></div>`;
}

/* ── Text lesson renderer ──────────────────────────────────────────────── */
function buildTextLesson(key, lesson){
  const content = window.DSA_LESSON_CONTENT && window.DSA_LESSON_CONTENT[key];
  if(!content) return `<div class="tl-wrap"><p style="color:var(--fog2);">Content not found for key: <code>${key}</code></p></div>`;
  const weekLabel = lesson._module ? `<span class="tl-meta-week">${lesson._module}</span>` : '';
  return `<div class="tl-wrap">
    <div class="tl-meta">${weekLabel}<span class="tl-meta-dur">⏱ ${content.duration_mins} min</span></div>
    ${(content.sections||[]).map(renderTLSection).join('')}
  </div>`;
}
function renderTLSection(s){
  if(s.type==='text') return s.body;
  if(s.type==='tip')  return `<div class="tl-tip"><strong>💡 Tip &nbsp;</strong>${s.body}</div>`;
  if(s.type==='warn') return `<div class="tl-warn"><strong>⚠ Watch out &nbsp;</strong>${s.body}</div>`;
  if(s.type==='code'){
    const id='c'+Math.random().toString(36).slice(2,7);
    const lang=s.lang||'python';
    const out=s.out?`<div class="tl-output"><div class="tl-output-label">Output</div>${escHtml(s.out)}</div>`:'';
    return `<div class="tl-code"><div class="tl-code-header"><span class="tl-code-lang">${lang}</span><button class="tl-code-copy" onclick="copyCode('${id}')">Copy</button></div><pre id="${id}"><code>${highlight(escHtml(s.src),lang)}</code></pre></div>${out}`;
  }
  if(s.type==='exercise'){
    const hid='h'+Math.random().toString(36).slice(2,7);
    const sid='s'+Math.random().toString(36).slice(2,7);
    const lang=s.lang||'python';
    const sol=s.solution?`<button class="tl-solution-toggle" onclick="var el=document.getElementById('${sid}');el.classList.toggle('open');this.textContent=el.classList.contains('open')?'Hide Solution':'Show Solution'">Show Solution</button><div class="tl-solution-body" id="${sid}"><div class="tl-code" style="margin-top:.75rem;"><div class="tl-code-header"><span class="tl-code-lang">solution</span></div><pre><code>${highlight(escHtml(s.solution),lang)}</code></pre></div></div>`:'';
    return `<div class="tl-exercise"><div class="tl-exercise-label">✏ Exercise</div><div class="tl-exercise-title">${s.title||'Practice'}</div>${s.body||''}<div class="tl-exercise-hint"><button class="tl-hint-toggle" onclick="var el=document.getElementById('${hid}');el.classList.toggle('open');this.textContent=el.classList.contains('open')?'Hide Hint':'Show Hint'">Show Hint</button>${sol}<div class="tl-hint-body" id="${hid}">${s.hint||''}</div></div></div>`;
  }
  return '';
}
function escHtml(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function highlight(c, lang){
  if(lang==='sql'){
    return c
      .replace(/(--[^\n]*)/g,'<span class="cm">$1</span>')
      .replace(/\b(SELECT|FROM|WHERE|GROUP\s+BY|ORDER\s+BY|HAVING|LIMIT|OFFSET|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|ALTER|DROP|TABLE|INDEX|VIEW|CONSTRAINT|ADD|COLUMN|PRIMARY\s+KEY|FOREIGN\s+KEY|REFERENCES|DEFAULT|UNIQUE|NOT\s+NULL|CHECK|SERIAL|INNER\s+JOIN|LEFT\s+JOIN|RIGHT\s+JOIN|FULL\s+OUTER\s+JOIN|CROSS\s+JOIN|JOIN|ON|USING|AS|WITH|RECURSIVE|CASE|WHEN|THEN|ELSE|END|AND|OR|NOT|IN|EXISTS|BETWEEN|LIKE|IS\s+NULL|IS\s+NOT\s+NULL|DISTINCT|ASC|DESC|OVER|PARTITION\s+BY|ROWS|RANGE|UNBOUNDED|PRECEDING|FOLLOWING|CURRENT\s+ROW|NULLS|EXPLAIN|ANALYZE|REFRESH|MATERIALIZED|CONCURRENTLY)\b/gi,'<span class="kw">$1</span>')
      .replace(/\b(COUNT|SUM|AVG|MIN|MAX|COALESCE|NULLIF|CAST|ROUND|TRUNC|ABS|NOW|DATE_TRUNC|EXTRACT|ROW_NUMBER|RANK|DENSE_RANK|NTILE|LAG|LEAD|FIRST_VALUE|LAST_VALUE|NTH_VALUE|GENERATE_SERIES|STRING_AGG|ARRAY_AGG)\b/gi,'<span class="bi">$1</span>')
      .replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g,'<span class="st">$1</span>')
      .replace(/\b(\d+\.?\d*)\b/g,'<span class="nm">$1</span>');
  }
  return c
    .replace(/(#[^\n]*)/g,'<span class="cm">$1</span>')
    .replace(/\b(def|class|return|import|from|as|if|elif|else|for|while|in|not|and|or|is|None|True|False|try|except|finally|raise|with|pass|break|continue|lambda|yield|global|nonlocal|del|assert)\b/g,'<span class="kw">$1</span>')
    .replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g,'<span class="st">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g,'<span class="nm">$1</span>')
    .replace(/\b(print|len|range|type|int|float|str|bool|list|dict|set|tuple|input|open|enumerate|zip|map|filter|sorted|reversed|sum|min|max|abs|round|isinstance|hasattr|getattr|setattr)\b/g,'<span class="bi">$1</span>');
}
function copyCode(id){
  const el=document.getElementById(id);if(!el)return;
  navigator.clipboard.writeText(el.textContent).then(()=>{
    const btn=el.closest('.tl-code')?.querySelector('.tl-code-copy');
    if(btn){btn.textContent='Copied!';setTimeout(()=>btn.textContent='Copy',1800);}
  });
}

/* ── portal:ready — load course & build accordion ─────────────────────── */
document.addEventListener('portal:ready', async()=>{
  const [{data:course},{data:progress}] = await Promise.all([
    supa.from('courses').select('*,modules(*,lessons(*))').eq('id',courseId).single(),
    supa.from('progress').select('lesson_id').eq('user_id',window._user.id)
  ]);

  document.getElementById('back-link').href=`course.html?id=${courseId}`;
  const done = new Set((progress||[]).map(p=>p.lesson_id));
  const mods = (course?.modules||[]).sort((a,b)=>a.order_index-b.order_index);
  allLessons = mods.flatMap(m=>(m.lessons||[]).sort((a,b)=>a.order_index-b.order_index).map(l=>({...l,_module:m.title})));
  currentIdx = Math.max(0, allLessons.findIndex(l=>l.id===lessonId));

  // Build accordion — auto-expand the module that contains the active lesson
  document.getElementById('lesson-list').innerHTML = mods.map(m => {
    const hasActive = m.lessons.some(l => l.id === lessonId);
    const doneCount = m.lessons.filter(l => done.has(l.id)).length;
    return `
      <div class="lsb-module ${hasActive ? 'open' : ''}">
        <div class="lsb-module-hd" onclick="this.closest('.lsb-module').classList.toggle('open')">
          <span style="flex:1;line-height:1.35;">${m.title}</span>
          <span style="font-size:.68rem;color:var(--fog2);margin-right:.4rem;white-space:nowrap;">${doneCount}/${m.lessons.length}</span>
          <span class="lsb-chevron">›</span>
        </div>
        <div class="lsb-module-body">
          ${(m.lessons||[]).sort((a,b)=>a.order_index-b.order_index).map(l=>`
            <a href="lesson.html?id=${l.id}&course=${courseId}"
               class="lsb-lesson ${l.id===lessonId?'active':''} ${done.has(l.id)?'done':''}">
              <div class="lt-icon ${LT[l.type]?.cls||'lt-video'}">${done.has(l.id)?'✅':LT[l.type]?.icon||'🎬'}</div>
              <span class="lsb-lesson-title">${l.title}</span>
            </a>`).join('')}
        </div>
      </div>`;
  }).join('');

  loadLesson(currentIdx, done);
  const cur = allLessons[currentIdx];
  if(cur?.type==='quiz') setTimeout(()=>loadQuiz(cur),50);
});

function loadLesson(idx, done){
  const l = allLessons[idx];
  if(!l)return;
  document.getElementById('player-embed').innerHTML = buildEmbed(l);
  document.getElementById('lesson-title').textContent = l.title;
  document.getElementById('lesson-meta').textContent = `${l._module}${l.duration_mins?' · '+l.duration_mins+' min':''}`;
  // scroll content area to top
  document.getElementById('lesson-content-area').scrollTop = 0;
  const doneBtn = document.getElementById('done-btn');
  if(done?.has(l.id)){doneBtn.textContent='✅ Completed';doneBtn.style.opacity='.6';doneBtn.disabled=true;}
  else{doneBtn.textContent='✓ Mark Complete';doneBtn.style.opacity='1';doneBtn.disabled=false;}
  document.getElementById('prev-btn').disabled = idx===0;
  document.getElementById('next-btn').disabled = idx===allLessons.length-1;
  document.getElementById('next-btn').onclick = ()=>{ location.href=`lesson.html?id=${allLessons[idx+1].id}&course=${courseId}`; };
  document.getElementById('prev-btn').onclick = ()=>{ location.href=`lesson.html?id=${allLessons[idx-1].id}&course=${courseId}`; };
}

async function markDone(){
  const l = allLessons[currentIdx];
  const {error}=await supa.from('progress').upsert({user_id:window._user.id,lesson_id:l.id},{onConflict:'user_id,lesson_id'});
  if(error){toast(error.message,'error');return;}
  toast('Lesson marked as complete ✅');
  const btn=document.getElementById('done-btn');
  btn.textContent='✅ Completed';btn.style.opacity='.6';btn.disabled=true;
  const sideLink=document.querySelector(`.lsb-lesson[href="lesson.html?id=${l.id}&course=${courseId}"] .lt-icon`);
  if(sideLink)sideLink.textContent='✅';

  const {data:prog}=await supa.from('progress').select('lesson_id').eq('user_id',window._user.id);
  const doneNow=new Set(prog.map(p=>p.lesson_id));
  if(allLessons.every(ls=>doneNow.has(ls.id))){
    await supa.from('certificates').upsert({user_id:window._user.id,course_id:courseId},{onConflict:'user_id,course_id'});
    toast('🏅 Course complete! Certificate issued — check your Certificates page.');
    setTimeout(()=>{ location.href='certificates.html'; },2500);
    return;
  }
  if(currentIdx<allLessons.length-1){
    setTimeout(()=>{ location.href=`lesson.html?id=${allLessons[currentIdx+1].id}&course=${courseId}`; },1200);
  }
}

/* ── Quiz ──────────────────────────────────────────────────────────────── */
async function loadQuiz(lesson){
  const {data:questions}=await supa.from('quiz_questions').select('*').eq('lesson_id',lesson.id).order('order_index');
  if(!questions?.length){
    document.getElementById('player-embed').innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:320px;gap:1rem;color:var(--fog2);font-family:var(--fb);"><div style="font-size:2.5rem;">📝</div><div>No questions added yet for this quiz.</div></div>`;
    return;
  }
  document.getElementById('player-embed').innerHTML=`
    <div style="padding:2rem;overflow-y:auto;height:100%;font-family:var(--fb);">
      <div style="font-family:var(--fd);font-size:1.3rem;font-weight:600;color:var(--cream);margin-bottom:1.5rem;">${lesson.title}</div>
      ${questions.map((q,qi)=>`
        <div style="background:rgba(11,12,14,.5);border:1px solid var(--border);border-radius:10px;padding:1.25rem;margin-bottom:1rem;" id="q-block-${qi}">
          <div style="font-size:.9rem;color:var(--cream);margin-bottom:1rem;line-height:1.6;">${qi+1}. ${q.question}</div>
          ${(q.options||[]).map((opt,oi)=>`
            <label style="display:flex;align-items:center;gap:.75rem;padding:.65rem .85rem;border-radius:7px;border:1px solid var(--border);margin-bottom:.5rem;cursor:pointer;transition:border-color .2s;" id="opt-${qi}-${oi}">
              <input type="radio" name="q${qi}" value="${oi}" onchange="checkAns(${qi},${oi},${q.correct_index},${JSON.stringify(q.options).replace(/"/g,'&quot;')})">
              <span style="font-size:.85rem;color:var(--fog);">${opt}</span>
            </label>`).join('')}
        </div>`).join('')}
      <div id="quiz-result" style="display:none;background:rgba(62,207,178,.08);border:1px solid rgba(62,207,178,.25);border-radius:10px;padding:1.25rem;text-align:center;margin-top:1rem;">
        <div style="font-size:1.5rem;margin-bottom:.5rem;">🎉</div>
        <div id="quiz-score" style="font-family:var(--fd);font-size:1.4rem;color:var(--teal);"></div>
      </div>
    </div>`;
  window._quizTotal=questions.length;window._quizScore=0;window._quizAnswered=new Set();
}

function checkAns(qi,selected,correct,opts){
  const block=document.getElementById(`q-block-${qi}`);
  block.querySelectorAll('label').forEach((lbl,oi)=>{
    lbl.style.borderColor=oi===correct?'rgba(62,207,178,.5)':oi===selected&&selected!==correct?'rgba(255,80,80,.4)':'var(--border)';
    lbl.style.background=oi===correct?'rgba(62,207,178,.07)':oi===selected&&selected!==correct?'rgba(255,80,80,.06)':'';
    lbl.querySelector('input').disabled=true;
  });
  if(!window._quizAnswered.has(qi)){
    window._quizAnswered.add(qi);
    if(selected===correct)window._quizScore++;
    if(window._quizAnswered.size===window._quizTotal){
      const res=document.getElementById('quiz-result');
      document.getElementById('quiz-score').textContent=`You scored ${window._quizScore} / ${window._quizTotal}`;
      res.style.display='block';res.scrollIntoView({behavior:'smooth'});
    }
  }
}

/* ── Comments ──────────────────────────────────────────────────────────── */
async function loadComments(){
  const {data:comments}=await supa.from('comments').select('*,profiles(name)').eq('lesson_id',lessonId).order('created_at',{ascending:true});
  const list=document.getElementById('comment-list');
  if(!comments||!comments.length){
    list.innerHTML='<div style="color:var(--fog2);font-family:var(--fb);font-size:.85rem;text-align:center;padding:1.5rem 0;">No comments yet. Be the first!</div>';
    return;
  }
  list.innerHTML=comments.map(c=>`
    <div class="comment-item">
      <div class="comment-avatar">${(c.profiles?.name||'?').charAt(0).toUpperCase()}</div>
      <div class="comment-body">
        <div class="comment-meta">
          <span class="comment-name">${c.profiles?.name||'Unknown'}</span>
          <span class="comment-time">${timeAgoC(c.created_at)}</span>
          ${c.user_id===window._user.id?`<button onclick="deleteComment('${c.id}',this)" style="background:none;border:none;color:var(--fog2);cursor:pointer;font-size:.75rem;margin-left:.25rem;padding:0;">✕</button>`:''}
        </div>
        <div class="comment-text">${c.body.replace(/\n/g,'<br>')}</div>
      </div>
    </div>`).join('');
}

document.getElementById('comment-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const body=document.getElementById('comment-input').value.trim();
  if(!body)return;
  const btn=e.target.querySelector('button[type=submit]');
  btn.disabled=true;btn.textContent='Posting…';
  const {error}=await supa.from('comments').insert({lesson_id:lessonId,user_id:window._user.id,body});
  btn.disabled=false;btn.textContent='Post Comment';
  if(error){toast(error.message,'error');return;}
  document.getElementById('comment-input').value='';
  await loadComments();
});

async function deleteComment(id,btn){
  btn.disabled=true;
  await supa.from('comments').delete().eq('id',id);
  await loadComments();
}

function timeAgoC(iso){
  const diff=Date.now()-new Date(iso).getTime();
  const m=Math.floor(diff/60000);
  if(m<1)return 'just now';
  if(m<60)return m+'m ago';
  const h=Math.floor(m/60);
  if(h<24)return h+'h ago';
  return new Date(iso).toLocaleDateString('en-IN');
}

document.addEventListener('portal:ready',()=>{
  const p=window._profile;
  const av=document.getElementById('comment-avatar');
  if(av)av.textContent=p.name.charAt(0).toUpperCase();
  if(lessonId)loadComments();
});
</script>
