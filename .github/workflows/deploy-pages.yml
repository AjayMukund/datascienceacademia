# Deploy only the website's own files to GitHub Pages (instead of the whole repository).
# The repo also holds ~80 MB of source images, the Flutter app, marketing notes and an archive —
# none of which the site serves — and publishing all of it made branch deploys slow enough to time out.
# Requires Settings → Pages → Source = "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site (served files only)
        run: |
          mkdir -p _site
          # root files that must be served from the site root
          cp *.html CNAME .nojekyll robots.txt sitemap.xml llms.txt manifest.json sw.js favicon.ico _site/
          # served folders
          cp -r assets content courses programmes blog codechamps student admin _site/
          mkdir -p _site/docs && cp docs/Company_Info.txt _site/docs/      # linked from llms.txt
          du -sh _site && find _site -type f | wc -l

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
