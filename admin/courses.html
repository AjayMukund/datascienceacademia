<main class="portal-main">
  <div class="portal-topbar">
    <div><div class="portal-page-title">Courses</div><div class="portal-page-sub" id="sub-count">Loading…</div></div>
    <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;">
      <div id="seed-btns" style="display:none;gap:.5rem;align-items:center;flex-wrap:wrap;"></div>
      <div style="position:relative;">
        <button id="btn-gear" class="portal-btn-ghost" style="font-size:.9rem;padding:7px 10px;" onclick="toggleGear()" title="Course tools">⚙</button>
        <div id="gear-menu" style="display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--surface,#1a1b1e);border:1px solid var(--border,#2a2b2e);border-radius:8px;min-width:170px;padding:6px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4);">
          <button class="portal-btn-ghost" style="width:100%;text-align:left;font-size:.8rem;padding:8px 10px;" onclick="checkSeeds();toggleGear()">🔍 Check for updates</button>
          <button class="portal-btn-ghost" style="width:100%;text-align:left;font-size:.8rem;padding:8px 10px;opacity:.6;" onclick="resetBaselines();toggleGear()" title="Clear all stored content baselines">↺ Reset baselines</button>
        </div>
      </div>
      <a href="course-editor.html?id=new" class="portal-btn">+ New Course</a>
      <button class="portal-mob-tog" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
    </div>
  </div>
  <div class="courses-grid" id="grid"></div>
</main>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/portal.js"></script>
<script src="../script.js"></script>
<script>
function toast(m,t='success'){const el=document.createElement('div');el.className=`toast-item ${t}`;el.textContent=m;document.getElementById('toast').appendChild(el);setTimeout(()=>el.remove(),3500);}

document.addEventListener('portal:ready',async()=>{
  const {data:courses,error}=await supa.from('courses').select('*,modules(id)').order('created_at',{ascending:false});
  if(error){toast(error.message,'error');return;}
  const grid=document.getElementById('grid');
  document.getElementById('sub-count').textContent=`${courses.length} course${courses.length!==1?'s':''} in catalogue`;
  if(!courses.length){
    grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📚</div><div class="empty-title">No courses yet</div><div class="empty-sub">Create your first course to get started.</div><a href="course-editor.html?id=new" class="portal-btn">+ Create Course</a></div>`;
    return;
  }
  grid.innerHTML=courses.map(c=>`
    <div class="course-card">
      <div class="course-thumb">${c.thumbnail_url?`<img src="${c.thumbnail_url}" alt="">`:'📚'}</div>
      <div class="course-body">
        <div class="course-title">${c.title}</div>
        <div class="course-desc">${c.description||'No description provided.'}</div>
        <div class="course-meta">
          <span class="badge badge-${c.status}">${c.status}</span>
          <span class="course-meta-item">📦 ${c.modules?.length||0} modules</span>
        </div>
      </div>
      <div class="course-footer">
        <a href="../student/course.html?id=${c.id}&preview=1" class="portal-btn-ghost" style="font-size:.72rem;padding:7px 14px;">👁 View</a>
        <a href="course-editor.html?id=${c.id}" class="portal-btn-ghost" style="font-size:.72rem;padding:7px 14px;">✏️ Edit</a>
        <button class="icon-btn danger" onclick="del('${c.id}','${c.title.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">🗑</button>
      </div>
    </div>`).join('');
});

async function del(id,title){
  if(!confirm(`Delete "${title}"? This cannot be undone.`))return;
  const {error}=await supa.from('courses').delete().eq('id',id);
  error?toast(error.message,'error'):(toast('Course deleted'),location.reload());
}

const SEED_DEFS=[
  {label:'Python',href:'seed-python-course.html',expected:47,match:/python/i,
   content:{file:'lesson-content.js',prefix:'python'}},
  {label:'SQL',href:'seed-sql-course.html',expected:30,match:/sql/i,
   content:{file:'sql-content.js',prefix:'sql'}},
  {label:'R',href:'seed-r-course.html',expected:30,match:/\br\b|r programming/i,
   content:{file:'r-content.js',prefix:'r'}},
  {label:'ML',href:'seed-ml-course.html',expected:48,match:/machine learning|ml/i,
   content:{file:'ml-content.js',prefix:'ml'}},
  {label:'DL',href:'seed-dl-course.html',expected:48,match:/deep learning|dl/i,
   content:{file:'dl-content.js',prefix:'dl'}},
  {label:'Feature Eng.',href:'seed-fe-course.html',expected:36,match:/feature engineering/i,
   content:{file:'fe-content.js',prefix:'fe'}},
  {label:'NLP',href:'seed-nlp-course.html',expected:48,match:/natural language|nlp/i,
   content:{file:'nlp-content.js',prefix:'nlp'}},
  {label:'CV',href:'seed-cv-course.html',expected:48,match:/computer vision/i,
   content:{file:'cv-content.js',prefix:'cv'}},
  {label:'Excel',href:'seed-excel-course.html',expected:36,match:/excel/i,
   content:{file:'excel-content.js',prefix:'excel'}},
  {label:'Tableau',href:'seed-tableau-course.html',expected:30,match:/tableau/i,
   content:{file:'tableau-content.js',prefix:'tableau'}},
  {label:'Power BI',href:'seed-powerbi-course.html',expected:36,match:/power.?bi/i,
   content:{file:'powerbi-content.js',prefix:'powerbi'}},
  {label:'AWS',href:'seed-aws-course.html',expected:36,match:/aws/i,
   content:{file:'aws-content.js',prefix:'aws'}},
  {label:'Azure',href:'seed-azure-course.html',expected:36,match:/azure/i,
   content:{file:'azure-content.js',prefix:'azure'}},
  {label:'Data Viz',href:'seed-dataviz-course.html',expected:36,match:/data.?vis/i,
   content:{file:'dataviz-content.js',prefix:'dataviz'}},
  {label:'LLM',href:'seed-llm-course.html',expected:48,match:/large language|llm/i,
   content:{file:'llm-content.js',prefix:'llm'}},
];

function toggleGear(){
  const m=document.getElementById('gear-menu');
  m.style.display=m.style.display==='none'?'block':'none';
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#btn-gear')&&!e.target.closest('#gear-menu'))
    document.getElementById('gear-menu').style.display='none';
});

function saveFp(prefix){
  localStorage.setItem('dsa_fp_'+prefix,contentFingerprint(prefix));
}

function resetBaselines(){
  Object.keys(localStorage).filter(k=>k.startsWith('dsa_fp_')).forEach(k=>localStorage.removeItem(k));
  toast('Baselines cleared — run Check for updates');
}

// Fingerprint = lesson count + section count per lesson (detects added/removed lessons and sections)
function contentFingerprint(prefix){
  const L=window.DSA_LESSON_CONTENT||{};
  const keys=Object.keys(L).filter(k=>k.startsWith(prefix+'-w')&&/l\d+$/.test(k)).sort();
  return keys.length+':'+keys.map(k=>(L[k].sections||[]).length).join(',');
}

function loadContentScripts(){
  return Promise.all(SEED_DEFS.map(d=>new Promise(resolve=>{
    if(document.querySelector('script[data-content="'+d.content.file+'"]')){resolve();return;}
    const s=document.createElement('script');
    s.src='../'+d.content.file;
    s.dataset.content=d.content.file;
    s.onload=resolve;s.onerror=resolve;
    document.head.appendChild(s);
  })));
}

async function checkSeeds(){
  const btn=document.getElementById('btn-check');
  btn.textContent='Checking…';btn.disabled=true;
  try{
    const[,{data:courses,error}]=await Promise.all([
      loadContentScripts(),
      supa.from('courses').select('id,title,modules(id,lessons(id,type,content_url))')
    ]);
    if(error)throw error;
    const content=window.DSA_LESSON_CONTENT||{};
    const needed=[];
    const passed=[];
    for(const def of SEED_DEFS){
      const prefix=def.content.prefix;
      const fp=contentFingerprint(prefix);
      const stored=localStorage.getItem('dsa_fp_'+prefix);
      // No baseline yet → unverified regardless of current state
      if(stored===null){
        needed.push({...def,reasons:[fp==='0:'?'content file missing or failed to load':'content not yet verified — seed to establish baseline']});
        continue;
      }
      // Baseline exists but content has changed since then → flag
      if(stored!==null&&stored!==fp){
        needed.push({...def,reasons:['content file updated since last seed']});
        continue;
      }
      // DB check + content-in-DB check
      const course=courses.find(c=>def.match.test(c.title));
      const allLessons=course?(course.modules||[]).flatMap(m=>m.lessons||[]):[];
      const actual=allLessons.length;
      const dbOk=course&&actual>=def.expected;
      const missing=allLessons
        .filter(l=>l.type==='text')
        .filter(l=>!content[l.content_url]||!(content[l.content_url].sections||[]).length);
      const contentOk=course&&missing.length===0;
      if(!dbOk||!contentOk){
        const reasons=[];
        if(!course)reasons.push('not seeded');
        else if(!dbOk)reasons.push(actual+'/'+def.expected+' lessons in DB');
        if(course&&!contentOk)reasons.push(missing.length+' lesson'+(missing.length!==1?'s':'')+' missing content ('+missing.map(l=>l.content_url).join(', ')+')');
        needed.push({...def,reasons});
      }else{
        passed.push({prefix,fp});
      }
    }
    const container=document.getElementById('seed-btns');
    if(!needed.length){
      container.style.display='none';
      toast('All courses are up to date ✓');
    }else{
      container.innerHTML=needed.map(d=>`<a href="${d.href}" class="portal-btn-ghost" style="font-size:.8rem;" title="${d.reasons.join(' · ')}" onclick="saveFp('${d.content.prefix}')">⚡ Seed ${d.label}</a>`).join('');
      container.style.display='flex';
      toast(`${needed.length} course${needed.length>1?'s':''} need seeding`,'error');
    }
  }catch(e){toast(e.message,'error');}
  btn.textContent='🔍 Check for updates';btn.disabled=false;
}
</script>
</body></html>
