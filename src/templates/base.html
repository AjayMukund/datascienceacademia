<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Generated by tools/build.py from src/ — edit the source templates, then rebuild. -->
<title>{% block title %}{{ site.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
<link rel="canonical" href="{{ canonical }}">
<meta name="robots" content="{% block robots %}index, follow, max-image-preview:large, max-snippet:-1{% endblock %}">
<meta name="theme-color" content="#0b0c0e">
<meta name="author" content="{{ site.legal }}">
<meta name="geo.region" content="IN-TN">
<meta name="geo.placename" content="Chennai">
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:locale" content="en_IN">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{{ self.description() }}{% endblock %}">
<meta property="og:image" content="{% block og_image %}{{ site.url }}/assets/og/default.jpg{% endblock %}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{% block og_image_alt %}{{ site.name }} — {{ site.tagline }}{% endblock %}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ self.og_title() }}">
<meta name="twitter:description" content="{{ self.og_description() }}">
<meta name="twitter:image" content="{{ self.og_image() }}">
{% block head_meta %}{% endblock %}
<link rel="icon" href="{{ rel }}favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="{{ rel }}favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="{{ rel }}favicon-192.png">
<link rel="apple-touch-icon" href="{{ rel }}apple-touch-icon.png">
<link rel="manifest" href="{{ rel }}manifest.json">
<link rel="preload" href="{{ rel }}assets/fonts/outfit-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ rel }}assets/fonts/cormorant-garamond-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ asset('assets/fonts/fonts.css') }}">
<link rel="stylesheet" href="{{ asset('style.css') }}">
<script>document.documentElement.classList.add('js');</script>
{% block head_extra %}{% endblock %}
{{ site_jsonld }}
{% block jsonld %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
<a class="skip-link" href="#main">Skip to content</a>
<div class="cur" id="cur" aria-hidden="true"></div>
<canvas id="bg-canvas" aria-hidden="true"></canvas>
{% include "partials/nav.html" %}
<main id="main">
{% block content %}{% endblock %}
</main>
{% include "partials/footer.html" %}
<script src="{{ asset('script.js') }}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
