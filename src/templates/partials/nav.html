<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="nav-brand" href="{{ rel }}index.html" aria-label="{{ site.name }} — home">
      <img class="nav-logo" src="{{ rel }}assets/img/logo-mark-64.png" srcset="{{ rel }}assets/img/logo-mark-64.png 1x, {{ rel }}assets/img/logo-mark-128.png 2x" width="40" height="40" alt="" decoding="async">
      <span><span class="nav-name">Data Science Academia</span><span class="nav-sub">{{ site.name_sub }}</span></span>
    </a>
    <nav class="nav-menu" id="nav-menu" aria-label="Primary">
      <ul class="nav-links">
        {% for key, label, href in nav_items %}
        <li><a href="{{ rel }}{{ href }}"{% if nav_active == key %} class="active" aria-current="page"{% endif %}>{{ label }}</a></li>
        {% endfor %}
      </ul>
      <div class="nav-actions">
        <a class="nav-signin" href="{{ rel }}login.html">Student sign in</a>
        <a class="btn btn-primary btn-sm" href="{{ rel }}contact.html">Enquire now <span class="arr">&rarr;</span></a>
      </div>
    </nav>
    <button class="theme-tog" type="button" aria-label="Switch to light theme" title="Switch to light theme">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
    </button>
    <button class="nav-tog" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu"><span></span><span></span><span></span></button>
  </div>
</header>
