<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Legacy URL shim generated by tools/build.py: {{ legacy }}?{{ param }}=<id> → static page -->
<title>Redirecting… — Data Science Academia</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="{{ site.url }}/{{ fallback }}">
<script>
(function(){
  var id=new URLSearchParams(location.search).get('{{ param }}');
  var map={{ map | tojson }};
  location.replace(id&&map[id]?map[id]:'{{ fallback }}');
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url={{ fallback }}"></noscript>
<style>body{font-family:system-ui,sans-serif;background:#0b0c0e;color:#f5f0e8;display:grid;place-items:center;min-height:100vh;margin:0}a{color:#dfc08a}</style>
</head>
<body>
<p>Redirecting… <a href="{{ fallback }}">Continue</a></p>
<ul hidden>
{% for id, href in map.items() %}<li><a href="{{ href }}">{{ id }}</a></li>
{% endfor %}</ul>
</body>
</html>
